[project]
name = "kairopact-assignment"
version = "0.1.0"
description = "Minimal AI workflow for KairoPact."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=2.2.0",
    "langfuse>=2.57.0",
    "langgraph>=0.2.56",
    "pinecone>=5.4.2",
    "pypdf>=5.1.0",
    "pydantic-settings>=2.6.1",
    "python-multipart>=0.0.12",
    "requests>=2.32.3",
    "streamlit>=1.40.0",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
